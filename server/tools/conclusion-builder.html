<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>结论表达引导</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    padding:14px 14px 18px;background:#fff;color:#1f2430;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6;overflow-x:hidden;
  }
  h1{margin:0 0 4px;font-size:16px;font-weight:600;color:#171c28}
  .sub{margin:0 0 12px;font-size:12px;color:#7b8397;line-height:1.5}
  .card{margin-bottom:10px;padding:12px;border:1px solid #e7eaf3;border-radius:12px;background:#fff}
  .card-title{margin-bottom:8px;font-size:13px;font-weight:600;color:#2a3142}
  .field{margin-bottom:10px}
  .field:last-child{margin-bottom:0}
  label{display:block;margin-bottom:5px;font-size:13px;color:#404859}
  textarea{
    display:block;width:100%;height:auto;min-height:78px;padding:8px 10px;border:1px solid #dfe4ef;
    border-radius:9px;background:#fbfcff;color:#1f2430;font-size:14px;line-height:1.6;
    font-family:inherit;outline:none;resize:vertical;transition:border-color .15s,box-shadow .15s;
  }
  textarea:focus{border-color:#4f6ef7;background:#fff;box-shadow:0 0 0 3px rgba(79,110,247,.12)}
  .tip{margin-bottom:10px;padding:9px 11px;border-radius:9px;background:#eef2ff;color:#3b4a86;font-size:12px;line-height:1.6}
  .preview{
    margin:0;padding:10px;border-radius:10px;background:#f7f8fc;color:#2d3448;
    font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
    font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
    max-height:260px;overflow:auto;
  }
  .actions{display:flex;gap:8px;margin-top:2px}
  .btn{
    flex:1 1 0;height:38px;border-radius:10px;border:1px solid transparent;font-family:inherit;
    font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s;
  }
  .btn-primary{background:#4f6ef7;color:#fff}
  .btn-primary:hover{background:#4361e3}
  .btn-ghost{background:#fff;border-color:#dfe4ef;color:#3c455c}
  .btn-ghost:hover{border-color:#b9c2d8;background:#fafbff}
  .status{min-height:18px;margin:8px 0 0;font-size:12px;color:#8a91a4;text-align:center}
  .status.ok{color:#1f8a5a}
</style>
</head>
<body>
  <h1>结论表达引导</h1>
  <p class="sub">用“数据 + 依据 + 建议”把结果写成一段完整的结论。</p>

  <div class="card">
    <div class="field">
      <label for="data">① 关键数据或事实</label>
      <textarea id="data" placeholder="例如：调查的 40 名同学中，有 28 人表示会随手关紧水龙头。"></textarea>
    </div>
    <div class="field">
      <label for="basis">② 数学依据（关系式 / 统计量 / 图形性质）</label>
      <textarea id="basis" placeholder="例如：28÷40=70%，用样本百分比估计总体比例。"></textarea>
    </div>
    <div class="field">
      <label for="advice">③ 建议或结论</label>
      <textarea id="advice" placeholder="例如：多数同学有节水意识，建议在洗手池旁增设提示牌。"></textarea>
    </div>
  </div>

  <div class="tip">提示：结论要区分“数据说明的事实”和“我的推测”。</div>

  <div class="card">
    <div class="card-title">三段式结论草稿</div>
    <pre id="preview" class="preview"></pre>
  </div>

  <div class="actions">
    <button id="appendBtn" class="btn btn-primary" type="button">写入我的作答</button>
    <button id="copyBtn" class="btn btn-ghost" type="button">复制结果</button>
  </div>
  <p id="status" class="status" role="status"></p>

<script>
(function () {
  var statusEl = document.getElementById('status');
  var previewEl = document.getElementById('preview');
  var sections = [
    { tag: '【数据】', el: document.getElementById('data') },
    { tag: '【依据】', el: document.getElementById('basis') },
    { tag: '【建议】', el: document.getElementById('advice') }
  ];

  function buildText() {
    var lines = ['结论草稿', ''];
    sections.forEach(function (section) {
      var content = section.el.value.trim() || '（待补充）';
      lines.push(section.tag + content);
    });
    return lines.join('\n');
  }

  function update() {
    previewEl.textContent = buildText();
  }

  function setStatus(msg, ok) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (ok ? ' ok' : '');
  }

  sections.forEach(function (section) {
    section.el.addEventListener('input', update);
  });

  document.getElementById('appendBtn').addEventListener('click', function () {
    try {
      const targetOrigin = (() => {
        try {
          const raw = new URLSearchParams(location.search).get('parentOrigin');
          return raw ? decodeURIComponent(raw) : '*';
        } catch {
          return '*';
        }
      })();
      window.parent.postMessage({ type: 'pbl-append', text: buildText() }, targetOrigin);
      setStatus('已写入，请回到作答区查看', true);
    } catch (err) {
      setStatus('写入失败，请改用复制结果', false);
    }
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(buildText()).then(function () {
        setStatus('已复制，可直接粘贴', true);
      }).catch(function () {
        setStatus('复制失败，请手动选中复制', false);
      });
    } else {
      setStatus('当前环境无法自动复制，请手动选中复制', false);
    }
  });

  update();
})();
</script>
</body>
</html>
