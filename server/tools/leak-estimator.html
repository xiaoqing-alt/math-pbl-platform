<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>漏水水量估算器</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    padding:14px 14px 18px;background:#fff;color:#1f2430;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6;overflow-x:hidden;
  }
  h1{margin:0 0 4px;font-size:16px;font-weight:600;color:#171c28}
  .sub{margin:0 0 12px;font-size:12px;color:#7b8397;line-height:1.5}
  .card{margin-bottom:10px;padding:12px;border:1px solid #e7eaf3;border-radius:12px;background:#fff}
  .card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:600;color:#2a3142}
  .field{margin-bottom:10px}
  .field:last-child{margin-bottom:0}
  label{display:block;margin-bottom:5px;font-size:13px;color:#404859}
  input[type=number],input[type=text],select,textarea{
    display:block;width:100%;height:36px;padding:0 10px;border:1px solid #dfe4ef;border-radius:9px;
    background:#fbfcff;color:#1f2430;font-size:14px;font-family:inherit;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  textarea{height:auto;min-height:76px;padding:8px 10px;line-height:1.6;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:#4f6ef7;background:#fff;box-shadow:0 0 0 3px rgba(79,110,247,.12)}
  .hint{margin:6px 0 0;font-size:12px;color:#8a91a4;line-height:1.5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{min-width:0;padding:8px 10px;border-radius:10px;background:#f6f8fe}
  .stat span{display:block;font-size:12px;color:#7b8397}
  .stat strong{display:block;font-size:15px;font-weight:600;color:#2c3550;word-break:break-all}
  .stat.highlight{grid-column:1 / -1;background:#eef2ff}
  .stat.highlight strong{color:#3b55d9;font-size:16px}
  .preview{
    margin:0;padding:10px;border-radius:10px;background:#f7f8fc;color:#2d3448;
    font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
    font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
    max-height:240px;overflow:auto;
  }
  .actions{display:flex;gap:8px;margin-top:2px}
  .btn{
    flex:1 1 0;height:38px;border-radius:10px;border:1px solid transparent;font-family:inherit;
    font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s;
  }
  .btn-primary{background:#4f6ef7;color:#fff}
  .btn-primary:hover{background:#4361e3}
  .btn-ghost{background:#fff;border-color:#dfe4ef;color:#3c455c}
  .btn-ghost:hover{border-color:#b9c2d8;background:#fafbff}
  .status{min-height:18px;margin:8px 0 0;font-size:12px;color:#8a91a4;text-align:center}
  .status.ok{color:#1f8a5a}
</style>
</head>
<body>
  <h1>漏水水量估算器</h1>
  <p class="sub">把一分钟的漏水读数，换算成一年浪费的水量和水费。</p>

  <div class="card">
    <div class="field">
      <label for="rate">每分钟平均流失水量（L）</label>
      <input id="rate" type="number" min="0" step="0.01" value="0.02" inputmode="decimal" />
      <p class="hint">若量杯读数为每分钟 20ml，请填 0.02 L。</p>
    </div>
    <div class="field">
      <label for="price">水价（元/吨，可选）</label>
      <input id="price" type="number" min="0" step="0.1" value="3.5" inputmode="decimal" />
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span>换算结果</span><span class="hint" style="margin:0">1 吨 = 1000 L</span></div>
    <div class="grid">
      <div class="stat"><span>每小时</span><strong id="vHour">1.20 L</strong></div>
      <div class="stat"><span>每日</span><strong id="vDay">28.80 L</strong></div>
      <div class="stat"><span>每月（30 天）</span><strong id="vMonth">864.00 L</strong></div>
      <div class="stat"><span>每年（365 天）</span><strong id="vYear">10512.00 L</strong></div>
      <div class="stat highlight"><span>一年浪费水费</span><strong id="vCost">36.79 元</strong></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span>结果预览</span></div>
    <pre id="preview" class="preview"></pre>
  </div>

  <div class="actions">
    <button id="appendBtn" class="btn btn-primary" type="button">写入我的作答</button>
    <button id="copyBtn" class="btn btn-ghost" type="button">复制结果</button>
  </div>
  <p id="status" class="status" role="status"></p>

<script>
(function () {
  var rateEl = document.getElementById('rate');
  var priceEl = document.getElementById('price');
  var previewEl = document.getElementById('preview');
  var statusEl = document.getElementById('status');
  var vHour = document.getElementById('vHour');
  var vDay = document.getElementById('vDay');
  var vMonth = document.getElementById('vMonth');
  var vYear = document.getElementById('vYear');
  var vCost = document.getElementById('vCost');

  function readNum(el) {
    var v = parseFloat(el.value);
    return isFinite(v) && v > 0 ? v : 0;
  }

  function round2(n) {
    return (Math.round(n * 100) / 100).toFixed(2);
  }

  function trimNum(n) {
    return String(Math.round(n * 100) / 100);
  }

  function buildText() {
    var rate = readNum(rateEl);
    var price = readNum(priceEl);
    var year = rate * 60 * 24 * 365;
    var lines = [
      '漏水水量估算',
      '每分钟流失：' + round2(rate) + ' L',
      '每小时：' + round2(rate * 60) + ' L',
      '每日：' + round2(rate * 60 * 24) + ' L',
      '每月（30天）：' + round2(rate * 60 * 24 * 30) + ' L',
      '每年（365天）：' + round2(year) + ' L'
    ];
    if (price > 0) {
      lines.push('按 ' + trimNum(price) + ' 元/吨计，一年约浪费 ' + round2(year / 1000 * price) + ' 元');
    }
    return lines.join('\n');
  }

  function update() {
    var rate = readNum(rateEl);
    var price = readNum(priceEl);
    var year = rate * 60 * 24 * 365;
    vHour.textContent = round2(rate * 60) + ' L';
    vDay.textContent = round2(rate * 60 * 24) + ' L';
    vMonth.textContent = round2(rate * 60 * 24 * 30) + ' L';
    vYear.textContent = round2(year) + ' L';
    vCost.textContent = price > 0 ? round2(year / 1000 * price) + ' 元' : '—';
    previewEl.textContent = buildText();
  }

  function setStatus(msg, ok) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (ok ? ' ok' : '');
  }

  rateEl.addEventListener('input', update);
  priceEl.addEventListener('input', update);

  document.getElementById('appendBtn').addEventListener('click', function () {
    try {
      const targetOrigin = (() => {
        try {
          const raw = new URLSearchParams(location.search).get('parentOrigin');
          return raw ? decodeURIComponent(raw) : '*';
        } catch {
          return '*';
        }
      })();
      window.parent.postMessage({ type: 'pbl-append', text: buildText() }, targetOrigin);
      setStatus('已写入，请回到作答区查看', true);
    } catch (err) {
      setStatus('写入失败，请改用复制结果', false);
    }
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(buildText()).then(function () {
        setStatus('已复制，可直接粘贴', true);
      }).catch(function () {
        setStatus('复制失败，请手动选中复制', false);
      });
    } else {
      setStatus('当前环境无法自动复制，请手动选中复制', false);
    }
  });

  update();
})();
</script>
</body>
</html>
