<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>统计图表探究</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    padding:14px 14px 18px;background:#fff;color:#1f2430;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6;overflow-x:hidden;
  }
  h1{margin:0 0 4px;font-size:16px;font-weight:600;color:#171c28}
  .sub{margin:0 0 12px;font-size:12px;color:#7b8397;line-height:1.5}
  .card{margin-bottom:10px;padding:12px;border:1px solid #e7eaf3;border-radius:12px;background:#fff}
  .card-title{margin-bottom:8px;font-size:13px;font-weight:600;color:#2a3142}
  label{display:block;margin-bottom:5px;font-size:13px;color:#404859}
  textarea{
    display:block;width:100%;height:auto;min-height:70px;padding:8px 10px;border:1px solid #dfe4ef;
    border-radius:9px;background:#fbfcff;color:#1f2430;font-size:13.5px;line-height:1.6;
    font-family:inherit;outline:none;resize:vertical;transition:border-color .15s,box-shadow .15s;
  }
  textarea:focus{border-color:#4f6ef7;background:#fff;box-shadow:0 0 0 3px rgba(79,110,247,.12)}
  .warn{margin:8px 0 0;padding:7px 9px;border-radius:8px;background:#fff4e8;color:#a25a12;font-size:12px}
  .btn{
    height:38px;border-radius:10px;border:1px solid transparent;font-family:inherit;
    font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s;
  }
  .btn-primary{background:#4f6ef7;color:#fff}
  .btn-primary:hover{background:#4361e3}
  .btn-ghost{background:#fff;border-color:#dfe4ef;color:#3c455c}
  .btn-ghost:hover{border-color:#b9c2d8;background:#fafbff}
  .btn-block{display:block;width:100%;margin-top:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{min-width:0;padding:8px 9px;border-radius:10px;background:#f6f8fe}
  .stat span{display:block;font-size:11.5px;color:#7b8397}
  .stat strong{display:block;font-size:14.5px;font-weight:600;color:#2c3550;word-break:break-word}
  .seg{display:flex;padding:3px;border-radius:9px;background:#f2f5fc;margin-bottom:10px}
  .segbtn{
    flex:1 1 0;border:0;background:transparent;color:#5a6478;font-family:inherit;font-size:12.5px;
    padding:7px 6px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;
  }
  .segbtn.active{background:#4f6ef7;color:#fff}
  .chart-box{border:1px solid #eef1f9;border-radius:10px;overflow:hidden;background:#fff}
  svg{display:block;width:100%;height:auto}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:8px}
  .legend[hidden]{display:none}
  .legend-item{display:flex;align-items:center;gap:5px;min-width:0;font-size:11.5px;color:#4a5268;line-height:1.4}
  .swatch{flex:none;width:9px;height:9px;border-radius:2px}
  .legend-item span:last-child{min-width:0;word-break:break-word}
  .tip{margin:8px 0 10px;font-size:12px;color:#8a91a4;line-height:1.5}
  .actions{display:flex;gap:8px;margin-top:2px}
  .actions .btn{flex:1 1 0}
  .status{min-height:18px;margin:8px 0 0;font-size:12px;color:#8a91a4;text-align:center}
  .status.ok{color:#1f8a5a}
</style>
</head>
<body>
  <h1>统计图表探究</h1>
  <p class="sub">修改数据、切换图表，比较三种统计图能读出什么。</p>

  <div class="card">
    <label for="dataInput">数据（用逗号或空格分隔）</label>
    <textarea id="dataInput" spellcheck="false">7.5, 8, 8, 9, 7, 6.5, 8, 9.5, 7, 8</textarea>
    <button id="updateBtn" class="btn btn-primary btn-block" type="button">更新数据</button>
    <p id="warn" class="warn" hidden>请输入至少一个有效数字</p>
  </div>

  <div class="card">
    <div class="card-title">统计量</div>
    <div class="grid3">
      <div class="stat"><span>样本量 n</span><strong id="statN">—</strong></div>
      <div class="stat"><span>平均数</span><strong id="statMean">—</strong></div>
      <div class="stat"><span>中位数</span><strong id="statMedian">—</strong></div>
      <div class="stat"><span>众数</span><strong id="statMode">—</strong></div>
      <div class="stat"><span>最小值</span><strong id="statMin">—</strong></div>
      <div class="stat"><span>最大值</span><strong id="statMax">—</strong></div>
    </div>
  </div>

  <div class="card">
    <div class="seg" id="chartSeg">
      <button class="segbtn active" type="button" data-chart="bar">条形图</button>
      <button class="segbtn" type="button" data-chart="pie">扇形图</button>
      <button class="segbtn" type="button" data-chart="line">折线图</button>
    </div>
    <div class="chart-box">
      <svg id="chart" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="统计图表"></svg>
    </div>
    <div class="legend" id="legend" hidden></div>
  </div>

  <p class="tip">提示：条形图看各类数量，扇形图看占比，折线图看数据按顺序的变化。</p>

  <div class="actions">
    <button id="appendBtn" class="btn btn-primary" type="button">写入我的作答</button>
    <button id="resetBtn" class="btn btn-ghost" type="button">重置</button>
  </div>
  <p id="status" class="status" role="status"></p>

<script>
(function () {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';
  var CHART_H = 180;
  var COLORS = [
    '#4f6ef7', '#7c93ff', '#f0a34c', '#38b48b', '#e8618c',
    '#8e6ef7', '#38a3d1', '#d4a017', '#6dbf67', '#b06ab3'
  ];

  var inputEl = document.getElementById('dataInput');
  var chartEl = document.getElementById('chart');
  var legendEl = document.getElementById('legend');
  var warnEl = document.getElementById('warn');
  var statusEl = document.getElementById('status');

  var statN = document.getElementById('statN');
  var statMean = document.getElementById('statMean');
  var statMedian = document.getElementById('statMedian');
  var statMode = document.getElementById('statMode');
  var statMin = document.getElementById('statMin');
  var statMax = document.getElementById('statMax');

  var state = {
    data: [],
    stats: null,
    chart: 'bar'
  };

  function svgEl(tag, attrs, text) {
    var el = document.createElementNS(NS, tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    }
    if (text != null) el.textContent = text;
    return el;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function fmt(n) {
    var v = Math.round(n * 100) / 100;
    if (v === 0) v = 0;
    return String(v);
  }

  function parseData(text) {
    var parts = String(text).split(/[,，、;；\s]+/);
    var out = [];
    parts.forEach(function (part) {
      if (!part) return;
      var num = Number(part);
      if (isFinite(num)) out.push(num);
    });
    return out;
  }

  function analyze(data) {
    var sorted = data.slice().sort(function (a, b) { return a - b; });
    var sum = 0;
    var i;
    for (i = 0; i < data.length; i++) sum += data[i];
    var mean = sum / data.length;
    var mid = Math.floor(sorted.length / 2);
    var median = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;

    var counts = {};
    data.forEach(function (num) {
      var key = String(num);
      counts[key] = (counts[key] || 0) + 1;
    });
    var keys = Object.keys(counts).map(Number).sort(function (a, b) { return a - b; });

    var maxCount = 0;
    keys.forEach(function (k) {
      if (counts[String(k)] > maxCount) maxCount = counts[String(k)];
    });

    var modeText = '无';
    if (maxCount > 1) {
      modeText = keys.filter(function (k) {
        return counts[String(k)] === maxCount;
      }).map(fmt).join('、');
    }

    return {
      n: data.length,
      mean: mean,
      median: median,
      min: sorted[0],
      max: sorted[sorted.length - 1],
      sorted: sorted,
      counts: counts,
      keys: keys,
      maxCount: maxCount,
      modeText: modeText
    };
  }

  function renderStats(s) {
    statN.textContent = String(s.n);
    statMean.textContent = fmt(s.mean);
    statMedian.textContent = fmt(s.median);
    statMode.textContent = s.modeText;
    statMin.textContent = fmt(s.min);
    statMax.textContent = fmt(s.max);
  }

  function drawBar(s) {
    var m = { l: 30, r: 10, t: 14, b: 26 };
    var pw = 320 - m.l - m.r;
    var ph = CHART_H - m.t - m.b;
    var base = m.t + ph;
    var maxC = s.maxCount;
    var keys = s.keys;

    var step = maxC <= 4 ? 1 : Math.ceil(maxC / 4);
    var ticks = [];
    var v;
    for (v = 0; v < maxC; v += step) ticks.push(v);
    ticks.push(maxC);

    ticks.forEach(function (tv) {
      var y = base - (tv / maxC) * ph;
      chartEl.appendChild(svgEl('line', {
        x1: m.l, y1: y, x2: 320 - m.r, y2: y,
        stroke: tv === 0 ? '#c9d1e3' : '#eef1f9', 'stroke-width': '1'
      }));
      chartEl.appendChild(svgEl('text', {
        x: m.l - 5, y: y + 3, 'font-size': '10', fill: '#9aa3b8', 'text-anchor': 'end'
      }, String(tv)));
    });

    chartEl.appendChild(svgEl('line', {
      x1: m.l, y1: m.t, x2: m.l, y2: base, stroke: '#c9d1e3', 'stroke-width': '1'
    }));

    var n = keys.length;
    var slot = pw / n;
    var bw = Math.max(8, Math.min(36, slot * 0.55));
    var showCount = n <= 12;
    var labelEvery = n > 12 ? Math.ceil(n / 12) : 1;

    keys.forEach(function (k, i) {
      var count = s.counts[String(k)];
      var h = (count / maxC) * ph;
      var x = m.l + slot * i + (slot - bw) / 2;
      var y = base - h;

      chartEl.appendChild(svgEl('rect', {
        x: x, y: y, width: bw, height: Math.max(h, 1), rx: 3,
        fill: count === maxC ? '#3b55d9' : '#4f6ef7'
      }));

      if (showCount) {
        chartEl.appendChild(svgEl('text', {
          x: x + bw / 2, y: y - 4, 'font-size': '9', fill: '#6b7488', 'text-anchor': 'middle'
        }, String(count)));
      }

      if (i % labelEvery === 0) {
        chartEl.appendChild(svgEl('text', {
          x: x + bw / 2, y: base + 14, 'font-size': n > 12 ? '8.5' : '10',
          fill: '#6b7488', 'text-anchor': 'middle'
        }, fmt(k)));
      }
    });
  }

  function pieArc(cx, cy, r, a0, a1) {
    var x0 = cx + r * Math.cos(a0);
    var y0 = cy + r * Math.sin(a0);
    var x1 = cx + r * Math.cos(a1);
    var y1 = cy + r * Math.sin(a1);
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    return 'M' + cx + ' ' + cy + ' L' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
      ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z';
  }

  function drawPie(s) {
    var cx = 160, cy = 88, r = 72;
    var a0 = -Math.PI / 2;
    var legendHtml = '';

    s.keys.forEach(function (k, i) {
      var count = s.counts[String(k)];
      var frac = count / s.n;
      var a1 = a0 + frac * Math.PI * 2;
      var color = COLORS[i % COLORS.length];
      var path;

      if (frac >= 0.9999) {
        path = svgEl('circle', { cx: cx, cy: cy, r: r, fill: color, stroke: '#fff', 'stroke-width': '1.5' });
      } else {
        path = svgEl('path', {
          d: pieArc(cx, cy, r, a0, a1), fill: color, stroke: '#fff', 'stroke-width': '1.5'
        });
      }
      path.appendChild(svgEl('title', {}, fmt(k) + '：' + count + ' 次，占 ' + (frac * 100).toFixed(1) + '%'));
      chartEl.appendChild(path);

      if (frac >= 0.07) {
        var mid = (a0 + a1) / 2;
        var lr = frac >= 0.9999 ? 0 : r * 0.62;
        chartEl.appendChild(svgEl('text', {
          x: (cx + lr * Math.cos(mid)).toFixed(1),
          y: (cy + lr * Math.sin(mid)).toFixed(1),
          'font-size': '10', 'font-weight': '600', fill: '#fff',
          'text-anchor': 'middle', 'dominant-baseline': 'middle'
        }, Math.round(frac * 100) + '%'));
      }

      legendHtml += '<div class="legend-item">' +
        '<span class="swatch" style="background:' + color + '"></span>' +
        '<span>' + fmt(k) + '：' + count + ' 次（' + (frac * 100).toFixed(1) + '%）</span>' +
        '</div>';

      a0 = a1;
    });

    legendEl.innerHTML = legendHtml;
    legendEl.hidden = false;
  }

  function drawLine(s) {
    var m = { l: 34, r: 12, t: 14, b: 26 };
    var pw = 320 - m.l - m.r;
    var ph = CHART_H - m.t - m.b;
    var base = m.t + ph;
    var data = state.data;
    var n = data.length;
    var min = s.min, max = s.max;
    var pad = (max - min) * 0.15 || 1;
    var lo = min - pad, hi = max + pad;

    function px(i) {
      return n === 1 ? m.l + pw / 2 : m.l + (i / (n - 1)) * pw;
    }
    function py(v) {
      return m.t + ph - ((v - lo) / (hi - lo)) * ph;
    }

    chartEl.appendChild(svgEl('line', {
      x1: m.l, y1: base, x2: 320 - m.r, y2: base, stroke: '#c9d1e3', 'stroke-width': '1'
    }));
    chartEl.appendChild(svgEl('line', {
      x1: m.l, y1: m.t, x2: m.l, y2: base, stroke: '#c9d1e3', 'stroke-width': '1'
    }));

    var ticks = [min, (min + max) / 2, max];
    ticks.forEach(function (tv) {
      var y = py(tv);
      chartEl.appendChild(svgEl('line', {
        x1: m.l, y1: y, x2: 320 - m.r, y2: y, stroke: '#eef1f9', 'stroke-width': '1'
      }));
      chartEl.appendChild(svgEl('text', {
        x: m.l - 5, y: y + 3, 'font-size': '9.5', fill: '#9aa3b8', 'text-anchor': 'end'
      }, fmt(tv)));
    });

    var pts = data.map(function (v, i) {
      return px(i).toFixed(2) + ',' + py(v).toFixed(2);
    }).join(' ');

    if (n > 1) {
      chartEl.appendChild(svgEl('polyline', {
        points: pts, fill: 'none', stroke: '#4f6ef7', 'stroke-width': '2',
        'stroke-linejoin': 'round', 'stroke-linecap': 'round'
      }));
    }

    var labelEvery = n > 12 ? Math.ceil(n / 12) : 1;
    data.forEach(function (v, i) {
      var x = px(i), y = py(v);
      chartEl.appendChild(svgEl('circle', {
        cx: x, cy: y, r: 3.2, fill: '#4f6ef7', stroke: '#fff', 'stroke-width': '1.2'
      }));
      if (i % labelEvery === 0 || i === n - 1) {
        chartEl.appendChild(svgEl('text', {
          x: x, y: base + 14, 'font-size': '9.5', fill: '#6b7488', 'text-anchor': 'middle'
        }, String(i + 1)));
      }
      if (n <= 8) {
        chartEl.appendChild(svgEl('text', {
          x: x, y: y - 7, 'font-size': '8', fill: '#7b8397', 'text-anchor': 'middle'
        }, fmt(v)));
      }
    });
  }

  function renderChart() {
    clear(chartEl);
    legendEl.innerHTML = '';
    legendEl.hidden = true;

    if (!state.stats) {
      chartEl.appendChild(svgEl('text', {
        x: 160, y: 95, 'font-size': '12', fill: '#9aa3b8', 'text-anchor': 'middle'
      }, '暂无数据'));
      return;
    }

    if (state.chart === 'bar') drawBar(state.stats);
    else if (state.chart === 'pie') drawPie(state.stats);
    else drawLine(state.stats);
  }

  function chartName() {
    return state.chart === 'bar' ? '条形图' : (state.chart === 'pie' ? '扇形图' : '折线图');
  }

  function insight() {
    var s = state.stats;
    var name = chartName();
    if (state.chart === 'line') {
      var maxIdx = state.data.indexOf(s.max);
      var minIdx = state.data.indexOf(s.min);
      return '折线图显示数据在 ' + fmt(s.min) + '～' + fmt(s.max) + ' 之间波动，' +
        '最大值出现在第 ' + (maxIdx + 1) + ' 个数据，最小值出现在第 ' + (minIdx + 1) + ' 个数据。';
    }
    if (s.maxCount <= 1) {
      return name + '显示每个数值都只出现 1 次，分布比较分散。';
    }
    return name + '显示 ' + s.modeText + ' 出现次数最多，共 ' + s.maxCount + ' 次。';
  }

  function buildRecord() {
    var s = state.stats;
    if (!s) {
      return '统计图表探究记录\n（暂无有效数据）';
    }
    return [
      '统计图表探究记录',
      '数据：' + state.data.map(fmt).join('、'),
      '图表类型：' + chartName(),
      '样本量 n=' + s.n + '，平均数=' + fmt(s.mean) + '，中位数=' + fmt(s.median) + '，众数=' + s.modeText,
      '最小值=' + fmt(s.min) + '，最大值=' + fmt(s.max),
      '从图中读出：' + insight()
    ].join('\n');
  }

  function applyData() {
    var arr = parseData(inputEl.value);
    if (!arr.length) {
      warnEl.hidden = false;
      return false;
    }
    warnEl.hidden = true;
    state.data = arr;
    state.stats = analyze(arr);
    renderStats(state.stats);
    renderChart();
    return true;
  }

  function setStatus(msg, ok) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (ok ? ' ok' : '');
  }

  document.getElementById('updateBtn').addEventListener('click', function () {
    applyData();
  });

  document.getElementById('chartSeg').addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('.segbtn') : null;
    if (!btn) return;
    state.chart = btn.getAttribute('data-chart');
    Array.prototype.forEach.call(document.querySelectorAll('#chartSeg .segbtn'), function (b) {
      b.classList.toggle('active', b === btn);
    });
    renderChart();
  });

  document.getElementById('appendBtn').addEventListener('click', function () {
    try {
      const targetOrigin = (() => {
        try {
          const raw = new URLSearchParams(location.search).get('parentOrigin');
          return raw ? decodeURIComponent(raw) : '*';
        } catch {
          return '*';
        }
      })();
      window.parent.postMessage({ type: 'pbl-append', text: buildRecord() }, targetOrigin);
      setStatus('已写入，请回到作答区查看', true);
    } catch (err) {
      setStatus('写入失败，请稍后再试', false);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    inputEl.value = '7.5, 8, 8, 9, 7, 6.5, 8, 9.5, 7, 8';
    state.chart = 'bar';
    Array.prototype.forEach.call(document.querySelectorAll('#chartSeg .segbtn'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-chart') === 'bar');
    });
    setStatus('');
    applyData();
  });

  applyData();
})();
</script>
</body>
</html>
